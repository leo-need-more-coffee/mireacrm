[project]
name = "mirea-contracts"
version = "0.1.0"
description = "Сгенерированный из proto/ код: сообщения и стабы gRPC"
requires-python = ">=3.11"
dependencies = ["protobuf>=5.28", "grpcio>=1.68"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mirea*"]
